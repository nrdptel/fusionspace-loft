name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege — the checks only read the repo. Mirrors the deploy workflow.
permissions:
  contents: read

# A new push to a branch supersedes its still-running checks instead of piling up.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      # The real-design corpus lives in a separate private repo, pinned by fixtures.lock.json. With
      # the secret set this fetches and hash-verifies it, so lib/corpus/sweep.test.ts genuinely gates
      # the push; without it (a fork, a public clone) the step exits 0 and the suite skips itself.
      - name: Fetch design corpus
        run: npm run fetch-fixtures
        env:
          FIXTURES_TOKEN: ${{ secrets.FIXTURES_TOKEN }}
      - name: Lint
        run: npm run lint
      # **Build BEFORE test, and the order is load-bearing.** `lib/docs-nav.test.ts` counts anchors and
      # prose budgets on the built export, because what a reader can link into is what shipped rather
      # than what a `.tsx` file intended — and `/out` is gitignored, so with `npm test` first that file
      # found no export and returned early. Five checks, green on every pull request since they landed,
      # having asserted nothing. The suite still skips gracefully for a local `npm test` with no build;
      # what it will not do is skip in CI, which `docsPages()` now refuses outright.
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    # 15 minutes stopped being enough the moment the suite reached 220 tests, and the failure mode is
    # the confusing one: GitHub reports a timeout as "cancelled", not as a failure, so the job reads
    # as though somebody stopped it rather than as a gate that can no longer pass. Measured on run
    # 30810888408: 11 min 09 s of checkout + `npm ci` + `playwright install` + `npm run build` before
    # the first test, then ~1.38 s per test at `workers: 1` (the config pins one worker in CI), which
    # is ~5 min for 220 — about 16.5 min in total, and more when `retries: 1` fires. It was cancelled
    # 160 tests in with nothing red.
    #
    # 30 rather than 20: the ceiling costs nothing on a passing run, `retries: 1` can add several
    # minutes on a flaky one, and a runner slower than this sample should not turn a green suite into
    # an ambiguous "cancelled" again. Raising workers would be the other lever and is deliberately not
    # taken here — this sandbox has already measured shard/worker concurrency producing unstable
    # counts with no failure line, and a timeout is not worth buying flakiness to fix.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: E2E (headless browser)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
